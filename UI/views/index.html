<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>コイントスアプリ</title>
  <style>
    body{
      background: #fff9cc;
      }
    .btn-border {
      width: 250px;
      height: 80px;
      background: transparent;
      color: #0075c1;
      border: 2px solid #0075c1;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      }

    .btn-border:hover {
      background: #0075c1;
      color: white;
      }
    .file-button {
      width: 500px;
      height: 600px;
      border: 2px green dotted;
      padding: 0;
      position: relative;
      }

    .file-button::file-selector-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      color: white;
      background: green;
      font-size: 14px;
      border: 0;
      border-radius: 10em;
      padding: 8px 16px;
      text-align: center;
      }
    
  </style>
</head>
<body>

<div style="padding: 30px; text-align: right;">
    <button type="submit" class="btn-border">ボタン</button>
</div>
<input type="file" class="file-button">
<p class="example1-r">
    テキスト
</p>

</body>


</html>
