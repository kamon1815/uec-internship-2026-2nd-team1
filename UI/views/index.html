<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>コイントスアプリ</title>
  <style>
        body{
      background: #fff9cc;
      }
    .btn-border {
      width: 250px;
      height: 80px;
      background: transparent;
      color: #0075c1;
      border: 2px solid #0075c1;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      }

    .btn-border:hover {
      background: #0075c1;
      color: white;
      }

    .field {
      display: flex;
      align-items: center; 
      gap: 30px;           
      }

    
    .dli-chevron-round-right {
      display: inline-block;
      vertical-align: middle;
      color: #333;
      line-height: 1;
      position: relative;
      width: 50px;
      height: 50px;
      transform: rotate(45deg); 
    }

    .dli-chevron-round-right::before, .dli-chevron-round-right::after {
      content: '';
      position: absolute;
      background: currentColor;
      border-radius: 7px;
    }

    .dli-chevron-round-right::before {
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .dli-chevron-round-right::after {
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
    }

  </style>

</head>
<body>

<div class="field" style="align-items: left;">



<img src="/live_stream" width="640" style="text-align: left;">



<span class="dli-chevron-round-right"></span>

<div>
<video id="videoPlayer" width="640" height="480" controls loop>
    <source id="videoSource" src="/videos/recorded_movie.mp4" type="video/mp4">
</video>
<p>
    現在の再生速度：
    <span id="speedDisplay">1.00</span>倍
</p>

<button type="button" onclick="changeSpeed(-0.25)">
    0.25下げる
</button>

<button type="button" onclick="changeSpeed(0.25)">
    0.25上げる
</button>
</div>
<button type="button" id="recordButton" class="btn-border" onclick="toggleRecording()">
  録画開始
</button>
</div>


<p id="recordingMessage"></p>

<script>
async function toggleRecording() {
    const recordButton = document.getElementById("recordButton");
    const videoPlayer = document.getElementById("videoPlayer");
    const videoSource = document.getElementById("videoSource");

    try {
        const response = await fetch("/toggle_recording", {
            method: "POST"
        });

        const result = await response.json();

        if (result.recording) {
            recordButton.textContent = "録画終了";
        } else {
            recordButton.textContent = "録画開始";

            // MP4の保存完了後、1秒待ってから表示
            setTimeout(() => {
                videoSource.src =
                    "/videos/recorded_movie.mp4?t=" + Date.now();

                videoPlayer.load();
            }, 1000);
        }
    } catch (error) {
        console.error(error);
    }
}

function changeSpeed(changeValue) {
    const videoPlayer = document.getElementById("videoPlayer");
    const speedDisplay = document.getElementById("speedDisplay");

    let newSpeed = videoPlayer.playbackRate + changeValue;

    // 0.25倍から2倍までに制限
    newSpeed = Math.max(0.25, Math.min(2, newSpeed));

    videoPlayer.playbackRate = newSpeed;
    speedDisplay.textContent = newSpeed.toFixed(2);
}

</script>


</body>


</html>
