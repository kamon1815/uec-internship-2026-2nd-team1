<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>コイントスアプリ</title>
    <style>
        body {
            background: #fff9cc;
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            color: #0075c1;
            margin-bottom: 30px;
        }
        .field {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .box {
            width: 600px;
        }
        .screen {
            width: 600px;
            height: 450px;
            background: black;
            object-fit: contain;
        }
        .arrow {
            font-size: 60px;
            color: #333;
        }
        .record-button {
            width: 250px;
            height: 65px;
            margin-top: 20px;
            background: white;
            color: #0075c1;
            border: 2px solid #0075c1;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        .record-button:hover {
            background: #0075c1;
            color: white;
        }
        .file-area {
            margin-bottom: 10px;
        }
        .speed-area {
            margin-top: 15px;
        }
        .speed-area button {
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
        }
        @media (max-width: 1300px) {
            .field {
                flex-direction: column;
            }
            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
<h1>コイントストラッカー</h1>
<div class="field">
    <div class="box">
        <h2>ライブ映像</h2>
        <img
            src="/live_stream"
            class="screen"
        >
        <button
            type="button"
            id="recordButton"
            class="record-button"
            onclick="toggleRecording()"
        >
            録画開始
        </button>
        <p id="recordingMessage"></p>
    </div>
    <div class="arrow">＝＞</div>
    <!-- 録画動画側 -->
    <div class="box">
        <h2>録画動画</h2>
        <div class="file-area">
            <input
                type="file"
                id="videoFile"
                accept="video/*"
            >
        </div>
        <video
            id="videoPlayer"
            class="screen"
            controls
            loop
            src="/videos/recorded_movie.mp4"
        ></video>
        <div class="speed-area">
            <p>
                現在の再生速度：
                <span id="speedDisplay">1.00</span>倍
            </p>
            <button
                type="button"
                onclick="changeSpeed(-0.25)"
            >
                0.25下げる
            </button>
            <button
                type="button"
                onclick="changeSpeed(0.25)"
            >
                0.25上げる
            </button>
        </div>
    </div>
</div>
<script>
    const videoPlayer =
        document.getElementById("videoPlayer");
    const videoFile =
        document.getElementById("videoFile");
    // 選択した動画を表示
    videoFile.addEventListener("change", function () {
        const selectedFile = this.files[0];
        if (selectedFile) {
            const videoURL =
                URL.createObjectURL(selectedFile);
            videoPlayer.src = videoURL;
            videoPlayer.load();
        }
    });
    // 録画開始・終了
    async function toggleRecording() {
        const recordButton =
            document.getElementById("recordButton");
        try {
            recordButton.textContent = "処理中です...";
            const response =
                await fetch("/toggle_recording", {
                    method: "POST"
                });
            const result = await response.json();
            if (result.recording) {
                recordButton.textContent = "録画終了";
            } else {
                recordButton.textContent = "録画開始";
                // 1秒待ってから録画動画を表示
                setTimeout(function () {
                    videoPlayer.src = "/video/" + result.output_mp4_path + "?t=" + Date.now();
                    videoPlayer.load();
                }, 1000);
            }
        } catch (error) {
            console.error(error);
        }
    }
    // 再生速度変更
    function changeSpeed(changeValue) {
        const speedDisplay =
            document.getElementById("speedDisplay");
        let newSpeed =
            videoPlayer.playbackRate + changeValue;
        newSpeed =
            Math.max(0.25, Math.min(2, newSpeed));
        videoPlayer.playbackRate = newSpeed;
        speedDisplay.textContent = newSpeed.toFixed(2);
    }
</script>
</body>
</html>
