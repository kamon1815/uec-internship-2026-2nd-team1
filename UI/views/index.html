<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>コイントスアプリ</title>
  <style>
    body{
      background: #fff9cc;
      }
    .btn-border {
      width: 250px;
      height: 80px;
      background: transparent;
      color: #0075c1;
      border: 2px solid #0075c1;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      }

    .btn-border:hover {
      background: #0075c1;
      color: white;
      }
  </style>

</head>
<body>

<div style="padding: 30px; text-align: right;">
    <button type="submit" class="btn-border">ボタン</button>
</div>
	<video id="test1" width="500" height="300" >
		<source src="mask.mp4" type="video/mp4">
	</video>

<img src="/live_stream" width="640" style="text-align: left;">
<button type="button" id="recordButton" class="btn-border" onclick="toggleRecording()">
  録画開始
</button>
<p id="recordingMessage"></p>
<script>
async function toggleRecording(){
  const recordButton = document.getElementById("recordButton");
  const recordingMessage = document.getElementById("recordingMessage");

  try{
    const responce = await fetch("/toggle_recording", {
      method: "POST"
    });

    const result = await responce.json();

    if (result.recording){
        recordButton.textContent = "録画終了";
        recordingMessage.textContent = "録画中";
    } else {
      recordButton.textContent = "録画開始";
      recordingMessage.textContent = "動画を保存しました";
    }
  } catch (error){
    console.error(error);
    recordingMessage.textContent = "エラーが発生しました"
  }
  }
</script>
</body>


</html>
